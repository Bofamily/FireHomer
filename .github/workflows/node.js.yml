name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.22.1]

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - run: npm install --save-dev web-ext

    # 1. Automatically calculate, create, and push the Git tag first
    - name: Bump Version and Push Git Tag
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: create_tag
      uses: anothrNick/github-tag-action@1.64.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch

    # 2. Extract tag, clean the 'v', and write it into your manifest file
    - name: Sync Version to manifest.json
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Fetch the new tag string (e.g., v1.0.5)
        RAW_TAG="${{ steps.create_tag.outputs.new_tag }}"
        
        # Strip the leading 'v' to make it compatible with web extensions (e.g., 1.0.5)
        CLEAN_VERSION="${RAW_TAG#v}"
        
        echo "Updating manifest.json version to: $CLEAN_VERSION"
        
        # Modify manifest.json in-place using jq
        jq ".version = \"$CLEAN_VERSION\"" manifest.json > temp.json && mv temp.json manifest.json

    # 3. Build the zip (it will now bundle the updated manifest.json)
    - name: Build Extension Zip
      run: npx web-ext build --overwrite-dest
      
    - name: Upload Extension Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-extension-zip
        path: web-ext-artifacts/

    # 4. Create the pre-release and attach the newly bundled zip file
    - name: Create GitHub Pre-Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_TAG: ${{ steps.create_tag.outputs.new_tag }}
      run: |
        gh release create "$NEW_TAG" \
          web-ext-artifacts/*.zip \
          --title "Pre-release $NEW_TAG" \
          --notes "Automated pre-release build generated from commit ${{ github.sha }}. Manifest version synced to ${NEW_TAG#v}." \
          --prerelease
