<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homepage Settings</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f7fb;
      color: #222;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .setting input {
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
    }

    button {
      cursor: pointer;
      background: #0060df;
      color: white;
      border: 0;
      border-radius: 6px;
    }

    #status {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>My Custom Homepage</h1>
  <p>Enter the website you want to open in every new tab.</p>

  <form id="settings-form">
    <label for="homepage">Website URL</label>
    <input
      id="homepage"
      type="url"
      placeholder="https://example.com"
      required
    >
    <label class="setting" for="embed-homepage">
      <input id="embed-homepage" type="checkbox">
      Embed homepage in new tabs (CAN BREAK SOME WEBSITES)
    </label>
    <button type="submit">Save Homepage</button>
  </form>

  <p id="status" role="status"></p>

  <script src="options.js"></script>
</body>
</html>
