<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Homepage</title>
  <style>
    html, body, #homepage {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
    }

    body {
      overflow: hidden;
    }

    #open-homepage {
      position: fixed;
      z-index: 1;
      top: 12px;
      right: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      background: #fff;
      color: #202124;
      font: 14px system-ui, sans-serif;
      text-decoration: none;
      box-shadow: 0 1px 4px #0004;
    }
  </style>
</head>
<body>
  <iframe id="homepage" title="Homepage" hidden></iframe>
  <a id="open-homepage" href="https://www.google.com" target="_blank" rel="noopener">Open homepage in new tab</a>
  <script src="newtab.js"></script>
</body>
</html>
